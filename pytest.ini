[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --no-migrations: this service ships no migrations by design (Alembic in Minty
# owns every table it touches), so there is nothing to run and Django would
# otherwise look for a pettycashv2 schema the SQLite test DB has no concept of.
# Tables are built from the models instead; see SHARED_MODELS_MANAGED_FOR_TESTING.
addopts = -v --tb=short --no-migrations
